name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the dmg
        run: scripts/package-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Release it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Bongo.dmg --title "$GITHUB_REF_NAME" --generate-notes
